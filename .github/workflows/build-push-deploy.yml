name: Fast Multi-arch Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/notification_service
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'main' || 'dev' }}
  CACHE_SCOPE: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run tests
        run: |
          echo "Running tests..."
          poetry run pytest || ([ $? -eq 5 ] && echo "No tests found - continuing" || exit $?)

  build:
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            cache-tag: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache-tag: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ env.CACHE_SCOPE }}-${{ matrix.cache-tag }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ env.CACHE_SCOPE }}-${{ matrix.cache-tag }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.cache-tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          images=""
          for d in *; do
            images="$images $IMAGE_NAME@sha256:$d"
          done
          docker buildx imagetools create \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            $images

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Redeploy notification_service on server via SSH (Infisical)
        uses: appleboy/ssh-action@v1.2.2
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_HOST || secrets.SERVER_HOST }}
          username: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_USER || secrets.SERVER_USER }}
          key: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_SSH_KEY || secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 600s
          envs: INFISICAL_CLIENT_ID,INFISICAL_CLIENT_SECRET,INFISICAL_PROJECT_ID,DEPLOY_BRANCH,DEPLOY_PATH
          script: |
            set -e
            if [ "$DEPLOY_BRANCH" = "main" ]; then
              COMPOSE_FILE="prod/docker-compose.yml"
              INFISICAL_ENV="prod"
            else
              COMPOSE_FILE="demo/docker-compose.demo.yml"
              INFISICAL_ENV="staging"
            fi
            if ! command -v infisical >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1; then
                curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
                sudo apt-get update
                sudo apt-get install -y infisical
              elif command -v apk >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1; then
                curl -fsSL 'https://artifacts-cli.infisical.com/setup.apk.sh' | sudo sh
                sudo apk update && sudo apk add infisical
              else
                ARCH=$(uname -m)
                case "$ARCH" in
                  x86_64) CLI_ARCH=linux_amd64 ;;
                  aarch64|arm64) CLI_ARCH=linux_arm64 ;;
                  armv7l) CLI_ARCH=linux_armv7 ;;
                  armv6l) CLI_ARCH=linux_armv6 ;;
                  *) echo "Unsupported uname -m for Infisical CLI: $ARCH"; exit 1 ;;
                esac
                VERSION=$(curl -fsSL https://api.github.com/repos/Infisical/cli/releases/latest | grep -o '"tag_name": *"v[^"]*"' | head -1 | sed 's/.*"v\([^"]*\)".*/\1/')
                TMP=$(mktemp -d)
                trap 'rm -rf "$TMP"' EXIT
                curl -fsSL "https://github.com/Infisical/cli/releases/download/v${VERSION}/cli_${VERSION}_${CLI_ARCH}.tar.gz" -o "$TMP/cli.tar.gz"
                tar -xzf "$TMP/cli.tar.gz" -C "$TMP"
                BIN=$(find "$TMP" -maxdepth 3 -name infisical -type f | head -1)
                if [ -z "$BIN" ]; then
                  echo "Infisical tarball did not contain an infisical binary"
                  exit 1
                fi
                if command -v sudo >/dev/null 2>&1; then
                  sudo install -m 0755 "$BIN" /usr/local/bin/infisical
                else
                  mkdir -p "$HOME/.local/bin"
                  install -m 0755 "$BIN" "$HOME/.local/bin/infisical"
                  export PATH="$HOME/.local/bin:$PATH"
                fi
              fi
            fi
            [ -n "${DEPLOY_PATH:-}" ] || { echo "DEPLOY_PATH is unset"; exit 1; }
            cd "$DEPLOY_PATH" || exit 1
            export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" --domain=https://eu.infisical.com --silent --plain)
            if [ -z "$INFISICAL_TOKEN" ]; then
              echo "Infisical login failed or returned empty token"
              exit 2
            fi

            ic_run() {
              infisical run --projectId="$INFISICAL_PROJECT_ID" --env="$INFISICAL_ENV" --token="$INFISICAL_TOKEN" --domain=https://eu.infisical.com -- "$@"
            }

            ic_run sh -c "docker compose -f $COMPOSE_FILE pull notification_service"
            ic_run sh -c "docker compose -f $COMPOSE_FILE up -d notification_service"
            echo "notification_service redeploy completed successfully"